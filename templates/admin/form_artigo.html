{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if artigo else 'Novo' }} artigo — Admin{% endblock %}

{% block conteudo %}
<section class="container pagina">
    <h1>{{ 'Editar' if artigo else 'Novo' }} artigo</h1>
    <form method="POST" enctype="multipart/form-data" class="form-admin">
        <label>Título
            <input type="text" name="titulo" value="{{ artigo.titulo if artigo else '' }}" required>
        </label>
        <label>Categoria
            <select name="categoria" required>
                <option value="noticias" {{ 'selected' if artigo and artigo.categoria=='noticias' }}>Notícias</option>
                <option value="preparacao" {{ 'selected' if artigo and artigo.categoria=='preparacao' }}>Preparação física</option>
            </select>
        </label>
        <label>Subcategoria (opcional)
            <input type="text" name="subcategoria" value="{{ artigo.subcategoria if artigo else '' }}">
        </label>
        <label>Resumo
            <textarea name="resumo" rows="3" required>{{ artigo.resumo if artigo else '' }}</textarea>
        </label>
        <label>Conteúdo (aceita HTML)
            <textarea name="conteudo" rows="15" required>{{ artigo.conteudo if artigo else '' }}</textarea>
        </label>
        <label>Imagem de capa
            <input type="file" name="imagem" accept="image/*">
        </label>
        <label class="checkbox">
            <input type="checkbox" name="destaque" {{ 'checked' if artigo and artigo.destaque }}> Destacar na home
        </label>
        <label>Status
            <select name="status">
                <option value="rascunho" {{ 'selected' if artigo and artigo.status=='rascunho' }}>Rascunho</option>
                <option value="publicado" {{ 'selected' if artigo and artigo.status=='publicado' }}>Publicado</option>
            </select>
        </label>
        <button class="btn" type="submit">Salvar</button>
    </form>
</section>
{% endblock %}
